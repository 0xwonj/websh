[tools]
wasm_opt = "version_129"

[build]
target = "index.html"
dist = "dist"
public_url = "./"
filehash = true

[watch]
watch = ["crates", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "Trunk.toml", "index.html", "_headers", "assets", "vendor"]
ignore = ["assets/bundle.css"]

[serve]
addresses = ["127.0.0.1"]
port = 8080

[[hooks]]
stage = "pre_build"
command = "stylance"
command_arguments = ["--output-file", "assets/bundle.css", "crates/websh-web"]
